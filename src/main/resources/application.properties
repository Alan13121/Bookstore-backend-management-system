
spring.application.name=demo

#指定資料庫密碼與diver
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

#在終端顯示hibernate產生的SQL指令
#改用下方 logging.level.org.hibernate.SQL 輸出，SQL 才會套用 log 格式並帶上 requestId
spring.jpa.show-sql=false

#用data、schema初始化資料庫
spring.sql.init.mode=always

#不靠JPA初始化
spring.jpa.hibernate.ddl-auto=none 

# JWT Token參數
jwt.secret=LyBGqP6T2B1q5m2jWj9KoP6x3F4Xk9R4p3WvZ5vL6Q8bY7R2e5S6c1G2x3N4t5Z6
jwt.expiration-ms=86400000

# 本地啟動
# spring.datasource.url=jdbc:mariadb://localhost:3300/bookshop

# docker啟動
spring.datasource.url=jdbc:mariadb://mariadb:3306/bookshop

# ===== Log 設定 =====
# log 等級由低到高：TRACE < DEBUG < INFO < WARN < ERROR，設定某個等級後只會顯示該等級以上的 log
# 本專案的程式（request/response body、方法執行階段）用 DEBUG，正式環境可改成 INFO 減少輸出
logging.level.root=INFO
logging.level.com.example.demo=DEBUG

# Hibernate 執行的 SQL
logging.level.org.hibernate.SQL=DEBUG
# SQL 中 ? 參數的實際值（量很大，而且會印出密碼雜湊等資料，需要時再打開）
#logging.level.org.hibernate.orm.jdbc.bind=TRACE

# 輸出格式：時間 等級 [requestId] 類別名稱 : 訊息
# %X{requestId:-main} 從 MDC 取出 requestId，沒有時（例如啟動階段）顯示 main
logging.pattern.console=%clr(%d{HH:mm:ss.SSS}){faint} %clr(%5p) %clr([%X{requestId:-main}]){magenta} %clr(%-32.32logger{31}){cyan} : %m%n%wEx

# 若想同時寫進檔案，取消下面這行的註解（Docker 中檔案會在容器內的 /app/logs）
#logging.file.name=logs/app.log
