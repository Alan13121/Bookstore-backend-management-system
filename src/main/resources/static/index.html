<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <!-- 讓手機以實際寬度顯示，Bootstrap 的響應式格線（col-md-* 等）才會生效 -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bookshop 管理系統</title>
    <!-- Bootstrap 5 從 CDN 載入；integrity（SRI）讓瀏覽器驗證檔案沒被竄改 -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&display=swap"
    />
    <!-- 自訂主題要放在 Bootstrap 之後，才能覆寫它的 CSS 變數 -->
    <link rel="stylesheet" href="/css/bookshop.css" />
  </head>
  <body>
    <nav class="navbar shop-navbar">
      <div class="container">
        <a class="navbar-brand" href="/index.html">📚 Bookshop 管理系統</a>
      </div>
    </nav>

    <main class="container py-4">
      <section class="hero p-4 p-md-5 mb-4">
        <h1 class="mb-2">歡迎來到 Bookshop 後台</h1>
        <p class="text-secondary mb-0">管理書籍、用戶與角色權限。可使用的功能依登入者的角色而定。</p>
      </section>

      <!-- 功能入口由 index.js 依登入者角色動態產生 -->
      <div id="menu" class="row g-3"></div>
    </main>

    <!-- Bootstrap 的 JS（Toast、Modal 元件需要），bundle 版已內含 Popper -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="/js/common.js"></script>
    <script src="/js/index.js"></script>
  </body>
</html>
