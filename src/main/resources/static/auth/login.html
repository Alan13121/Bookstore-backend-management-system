<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <!-- 讓手機以實際寬度顯示，Bootstrap 的響應式格線（col-md-* 等）才會生效 -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>登入</title>
    <!-- Bootstrap 5 從 CDN 載入；integrity（SRI）讓瀏覽器驗證檔案沒被竄改 -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&display=swap"
    />
    <!-- 自訂主題要放在 Bootstrap 之後，才能覆寫它的 CSS 變數 -->
    <link rel="stylesheet" href="/css/bookshop.css" />
  </head>
  <body>
    <nav class="navbar shop-navbar">
      <div class="container">
        <a class="navbar-brand" href="/index.html">📚 Bookshop 管理系統</a>
      </div>
    </nav>

    <main class="auth-wrapper">
      <div class="card auth-card">
        <div class="card-body p-4 p-md-5">
          <h1 class="h3 text-center mb-4">🔐 登入</h1>
          <form id="login-form">
            <div class="mb-3">
              <label for="login-username" class="form-label">帳號</label>
              <input type="text" class="form-control" id="login-username" autocomplete="username" required />
            </div>
            <div class="mb-3">
              <label for="login-password" class="form-label">密碼</label>
              <input type="password" class="form-control" id="login-password" autocomplete="current-password" required />
            </div>
            <button type="submit" class="btn btn-primary w-100 mt-2">登入</button>
          </form>

          <div class="output-box alert alert-danger mt-3 mb-0 small" id="output"></div>

          <div class="d-flex flex-wrap justify-content-center gap-3 mt-4 small">
            <a href="reset-password.html">忘記密碼？</a>
            <a href="register.html">註冊新帳號</a>
            <a href="/index.html">返回首頁</a>
          </div>
        </div>
      </div>
    </main>

    <script src="/js/common.js"></script>
    <script src="/js/login.js"></script>
  </body>
</html>
