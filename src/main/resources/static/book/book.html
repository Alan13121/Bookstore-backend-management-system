<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <!-- 讓手機以實際寬度顯示，Bootstrap 的響應式格線（col-md-* 等）才會生效 -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>編輯書籍</title>
    <!-- Bootstrap 5 從 CDN 載入；integrity（SRI）讓瀏覽器驗證檔案沒被竄改 -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&display=swap"
    />
    <!-- 自訂主題要放在 Bootstrap 之後，才能覆寫它的 CSS 變數 -->
    <link rel="stylesheet" href="/css/bookshop.css" />
  </head>
  <body>
    <nav class="navbar shop-navbar">
      <div class="container">
        <a class="navbar-brand" href="/index.html">📚 Bookshop 管理系統</a>
      </div>
    </nav>

    <main class="container py-4" style="max-width: 760px">
      <div class="page-title d-flex flex-wrap align-items-center justify-content-between gap-2">
        <h1>📖 編輯書籍</h1>
        <a class="btn btn-sm btn-outline-secondary" href="/book/books.html">← 返回書籍列表</a>
      </div>

      <div class="card">
        <div class="card-body p-4">
          <form id="edit-book-form" novalidate>
            <!-- fieldset 讓 JS 可以一次停用 / 啟用整個表單（資料載入完成前先停用） -->
            <fieldset class="row g-3">
              <div class="col-12 text-secondary">ID：<span id="book-id"></span></div>
              <div class="col-12">
                <label for="book-title" class="form-label">書名 <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="book-title" required />
              </div>
              <div class="col-12">
                <label for="book-author" class="form-label">作者</label>
                <input type="text" class="form-control" id="book-author" />
              </div>
              <div class="col-12">
                <label for="book-desc" class="form-label">簡述</label>
                <textarea class="form-control" id="book-desc" rows="3"></textarea>
              </div>
              <div class="col-sm-6">
                <label for="book-list-price" class="form-label">定價</label>
                <input type="number" class="form-control" id="book-list-price" min="0" step="any" />
              </div>
              <div class="col-sm-6">
                <label for="book-sale-price" class="form-label">售價</label>
                <input type="number" class="form-control" id="book-sale-price" min="0" step="any" />
              </div>
              <div class="col-12">
                <button type="submit" class="btn btn-primary">保存</button>
              </div>
            </fieldset>
          </form>
        </div>
      </div>
    </main>

    <!-- Bootstrap 的 JS（Toast、Modal 元件需要），bundle 版已內含 Popper -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="/js/common.js"></script>
    <script src="/js/book.js"></script>
  </body>
</html>
