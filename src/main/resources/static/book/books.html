<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <!-- 讓手機以實際寬度顯示，Bootstrap 的響應式格線（col-md-* 等）才會生效 -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>書籍管理</title>
    <!-- Bootstrap 5 從 CDN 載入；integrity（SRI）讓瀏覽器驗證檔案沒被竄改 -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&display=swap"
    />
    <!-- 自訂主題要放在 Bootstrap 之後，才能覆寫它的 CSS 變數 -->
    <link rel="stylesheet" href="/css/bookshop.css" />
  </head>
  <body>
    <nav class="navbar shop-navbar">
      <div class="container">
        <a class="navbar-brand" href="/index.html">📚 Bookshop 管理系統</a>
      </div>
    </nav>

    <main class="container py-4">
      <div class="page-title d-flex flex-wrap align-items-center justify-content-between gap-2">
        <h1>📖 書籍管理</h1>
        <a class="btn btn-sm btn-outline-secondary" href="/index.html">← 返回首頁</a>
      </div>

      <div class="card mb-4">
        <div class="card-header"><h2>📋 所有書籍</h2></div>
        <!-- 表格由 books.js 產生；table-responsive 讓窄螢幕可以左右捲動表格 -->
        <div class="card-body table-responsive" id="book-table"></div>
      </div>

      <div class="card">
        <div class="card-header"><h2>➕ 新增書籍</h2></div>
        <div class="card-body">
          <!-- Bootstrap 格線：手機一欄一列，md 以上依 col-md-* 排成多欄 -->
          <form id="create-book-form" class="row g-3">
            <div class="col-md-6">
              <label for="book-title" class="form-label">書名 <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="book-title" required />
            </div>
            <div class="col-md-6">
              <label for="book-author" class="form-label">作者</label>
              <input type="text" class="form-control" id="book-author" />
            </div>
            <div class="col-12">
              <label for="book-desc" class="form-label">簡述</label>
              <input type="text" class="form-control" id="book-desc" />
            </div>
            <div class="col-sm-6 col-md-3">
              <label for="book-list-price" class="form-label">定價</label>
              <input type="number" class="form-control" id="book-list-price" min="0" step="any" />
            </div>
            <div class="col-sm-6 col-md-3">
              <label for="book-sale-price" class="form-label">售價</label>
              <input type="number" class="form-control" id="book-sale-price" min="0" step="any" />
            </div>
            <div class="col-12">
              <button type="submit" class="btn btn-primary">新增書籍</button>
            </div>
          </form>
        </div>
      </div>
    </main>

    <script src="/js/common.js"></script>
    <script src="/js/books.js"></script>
  </body>
</html>
