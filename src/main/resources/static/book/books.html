<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <title>📖 書籍管理</title>
  </head>
  <body>
    <h1>📖 書籍管理</h1>
    <a href="/index.html">返回首頁</a>

    <h3>📋 所有書籍</h3>
    <div id="book-table"></div>

    <h3>➕ 新增書籍</h3>
    <form id="create-book-form">
      <input type="text" id="book-title" placeholder="書名" required />
      <input type="text" id="book-author" placeholder="作者" />
      <input type="text" id="book-desc" placeholder="簡述" />
      <input type="number" id="book-list-price" placeholder="定價" min="0" step="any" />
      <input type="number" id="book-sale-price" placeholder="售價" min="0" step="any" />
      <button type="submit">新增書籍</button>
    </form>

    <script src="/js/common.js"></script>
    <script src="/js/books.js"></script>
  </body>
</html>
