<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <!-- 讓手機以實際寬度顯示，Bootstrap 的響應式格線（col-md-* 等）才會生效 -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>用戶管理</title>
    <!-- Bootstrap 5 從 CDN 載入；integrity（SRI）讓瀏覽器驗證檔案沒被竄改 -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&display=swap"
    />
    <!-- 自訂主題要放在 Bootstrap 之後，才能覆寫它的 CSS 變數 -->
    <link rel="stylesheet" href="/css/bookshop.css" />
  </head>
  <body>
    <nav class="navbar shop-navbar">
      <div class="container">
        <a class="navbar-brand" href="/index.html">📚 Bookshop 管理系統</a>
      </div>
    </nav>

    <main class="container py-4">
      <div class="page-title d-flex flex-wrap align-items-center justify-content-between gap-2">
        <h1>👤 用戶管理</h1>
        <a class="btn btn-sm btn-outline-secondary" href="/index.html">← 返回首頁</a>
      </div>

      <div class="card mb-4">
        <div class="card-header"><h2>📋 用戶列表</h2></div>
        <div class="card-body table-responsive" id="user-table"></div>
      </div>

      <div class="card">
        <div class="card-header"><h2>➕ 新增用戶</h2></div>
        <div class="card-body">
          <form id="create-user-form" class="row g-3">
            <div class="col-md-6">
              <label for="new-username" class="form-label">帳號 <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="new-username" autocomplete="off" required />
            </div>
            <div class="col-md-6">
              <label for="new-password" class="form-label">密碼 <span class="text-danger">*</span></label>
              <input type="password" class="form-control" id="new-password" autocomplete="new-password" required />
            </div>
            <div class="col-md-4">
              <label for="new-fullName" class="form-label">姓名</label>
              <input type="text" class="form-control" id="new-fullName" />
            </div>
            <div class="col-md-4">
              <label for="new-email" class="form-label">Email</label>
              <input type="email" class="form-control" id="new-email" />
            </div>
            <div class="col-md-4">
              <label for="new-phone" class="form-label">電話</label>
              <input type="tel" class="form-control" id="new-phone" />
            </div>
            <div class="col-md-4">
              <label for="new-enabled" class="form-label">帳號狀態</label>
              <select class="form-select" id="new-enabled">
                <option value="true">啟用</option>
                <option value="false">停用</option>
              </select>
            </div>
            <div class="col-md-8">
              <span class="form-label d-block">角色</span>
              <!-- 勾選框由 common.js 的 renderRoleCheckboxes 產生 -->
              <div id="new-roles"></div>
            </div>
            <div class="col-12">
              <button type="submit" class="btn btn-primary">新增用戶</button>
            </div>
          </form>
        </div>
      </div>
    </main>

    <script src="/js/common.js"></script>
    <script src="/js/users.js"></script>
  </body>
</html>
