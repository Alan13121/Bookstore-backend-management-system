<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <!-- 讓手機以實際寬度顯示，Bootstrap 的響應式格線（col-md-* 等）才會生效 -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>角色權限管理</title>
    <!-- Bootstrap 5 從 CDN 載入；integrity（SRI）讓瀏覽器驗證檔案沒被竄改 -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&display=swap"
    />
    <!-- 自訂主題要放在 Bootstrap 之後，才能覆寫它的 CSS 變數 -->
    <link rel="stylesheet" href="/css/bookshop.css" />
  </head>
  <body>
    <nav class="navbar shop-navbar">
      <div class="container">
        <a class="navbar-brand" href="/index.html">📚 Bookshop 管理系統</a>
      </div>
    </nav>

    <main class="container py-4">
      <div class="page-title d-flex flex-wrap align-items-center justify-content-between gap-2">
        <h1>🛡️ 角色權限管理</h1>
        <a class="btn btn-sm btn-outline-secondary" href="/index.html">← 返回首頁</a>
      </div>

      <div class="card mb-4">
        <div class="card-header"><h2>👥 用戶角色總覽</h2></div>
        <div class="card-body">
          <!-- 每個用戶一張小卡片，由 roles.js 產生，用格線排成多欄 -->
          <div id="user-roles-container" class="row g-3"></div>
        </div>
      </div>

      <div class="row g-4">
        <div class="col-lg-5">
          <div class="card h-100">
            <div class="card-header"><h2>🎭 角色管理</h2></div>
            <div class="card-body">
              <form id="role-form" novalidate class="d-flex align-items-start gap-2 mb-4">
                <label for="role-name" class="visually-hidden">角色名稱</label>
                <!-- 外包一層 div：驗證失敗時錯誤訊息會插在輸入框下方，而不是擠進同一排 -->
                <div class="flex-grow-1">
                  <input type="text" class="form-control" id="role-name" placeholder="新角色名稱" required />
                </div>
                <button type="submit" class="btn btn-primary text-nowrap">新增</button>
              </form>
              <h3 class="h6 text-secondary">現有角色</h3>
              <ul id="role-list" class="list-group"></ul>
            </div>
          </div>
        </div>

        <div class="col-lg-7">
          <div class="card h-100">
            <div class="card-header"><h2>🔐 權限規則管理</h2></div>
            <div class="card-body">
              <form id="rule-form" novalidate class="row g-2 mb-4">
                <div class="col-sm-6">
                  <label for="rule-url-pattern" class="form-label small">URL Pattern</label>
                  <input type="text" class="form-control font-monospace-input" id="rule-url-pattern" placeholder="/book/.*" required />
                </div>
                <div class="col-sm-4">
                  <label for="rule-roles" class="form-label small">角色（逗號分隔）</label>
                  <input type="text" class="form-control" id="rule-roles" placeholder="ADMIN,STAFF" required />
                </div>
                <div class="col-sm-2 d-flex align-items-end">
                  <button type="submit" class="btn btn-primary w-100">新增</button>
                </div>
              </form>
              <h3 class="h6 text-secondary">現有規則</h3>
              <ul id="rule-list" class="list-group"></ul>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- Bootstrap 的 JS（Toast、Modal 元件需要），bundle 版已內含 Popper -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="/js/common.js"></script>
    <script src="/js/roles.js"></script>
  </body>
</html>
